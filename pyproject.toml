[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "savant-extras"
version = "0.6.1"
description = "Baseball Savant leaderboards that pybaseball lacks, with date ranges and season checks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "yasumorishima" },
]
keywords = ["baseball", "mlb", "statcast", "baseball-savant", "bat-tracking", "pitch-tempo", "arm-strength", "pitch-movement", "catcher", "baserunning", "pybaseball", "abs-challenge", "minor-league", "triple-a"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=1.3",
  "requests>=2.27",
  "lxml>=4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/yasumorishima/savant-extras"
Repository = "https://github.com/yasumorishima/savant-extras"

[tool.pytest.ini_options]
testpaths = ["tests"]
