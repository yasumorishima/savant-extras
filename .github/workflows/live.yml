name: Live Savant

# Real requests to Baseball Savant (tests/live). The unit tests mock every
# request, so they cannot notice Savant changing a parameter or a column.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図（必須）'
        required: true
        type: string

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run live tests
        env:
          SAVANT_LIVE: "1"
        run: pytest tests/live -v
