name: Live Savant

# Real requests to Baseball Savant (tests/live). The unit tests mock every
# request, so they cannot notice Savant changing a parameter or a column.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図（必須）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run live tests
        env:
          SAVANT_LIVE: "1"
        run: pytest tests/live -v
